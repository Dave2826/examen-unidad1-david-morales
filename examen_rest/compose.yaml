services:
  api:
    build: .
    container_name: examen_rest_api
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: laboratorio
      MYSQL_PASSWORD: laboratorio
      MYSQL_DATABASE: laboratorio
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    container_name: examen_rest_mysql
    environment:
      MYSQL_DATABASE: laboratorio
      MYSQL_USER: laboratorio
      MYSQL_PASSWORD: laboratorio
      MYSQL_ROOT_PASSWORD: laboratorio
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ulaboratorio", "-plaboratorio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: